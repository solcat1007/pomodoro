<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>番茄钟 · 专注计时器</title>
<meta name="description" content="25 分钟专注 + 5 分钟休息，可自定义时长，自动循环">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#e5533d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="番茄钟">
<style>

:root{
  --bg:#f4f5f7;           /* 页面底色：浅灰，避免纯白刺眼 */
  --bg-glow:#ffffff;      /* 顶部径向光晕色，制造轻微的空间感 */
  --surface:#ffffff;      /* 卡片底色 */
  --surface-2:#fafbfc;    /* 卡片内的次级区块（输入框、结果区） */
  --text:#16181d;         /* 主文字 */
  --soft:#5d636e;         /* 次要文字 */
  --mute:#8b929e;         /* 弱化文字（提示、单位、占位符） */
  --line:#e6e8ec;         /* 分割线与边框 */
  --accent:#26a69a;       /* 强调色（各玩具不同） */
  --accent-soft:#e6f4f2;  /* 强调色的浅色版，用于底色块 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  /* 顶部一层极淡光晕，比死板的纯色更有层次 */
  background-image:radial-gradient(120% 80% at 50% 0%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}

.app{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:20px}

.head{text-align:center}
.head h1{font-size:22px; font-weight:600; letter-spacing:.5px}
.head p{font-size:13px; color:var(--mute); margin-top:6px}

.card{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow);
}

.stage{
  width:288px; height:288px; position:relative;
  background:var(--surface); border:1px solid var(--line);
  border-radius:50%; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
}
.stage canvas{border-radius:50%}

.phase{
  font-size:29px; font-weight:300; letter-spacing:6px;
  color:var(--accent); min-height:42px; text-align:center;
  transition:color .4s var(--ease);
}
.cd{font-size:15px; color:var(--soft); font-variant-numeric:tabular-nums; min-height:22px}
.meta{font-size:13px; color:var(--mute); min-height:20px; text-align:center}

.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.stats{display:flex; gap:10px; width:100%}
.stat{
  flex:1; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:12px; text-align:center;
}
.stat .k{font-size:11px; color:var(--mute); letter-spacing:1px}
.stat .v{font-size:21px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}

.chip{
  padding:9px 18px; font-size:13px; font-weight:500; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.14);
}

.btn{
  padding:13px 42px; font-size:15px; font-weight:600; font-family:inherit;
  letter-spacing:3px; background:var(--accent); color:#fff;
  border:none; border-radius:var(--r-md); cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--soft); box-shadow:none}

.lang{
  position:fixed; top:16px; right:16px; z-index:20;
  padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent); color:var(--accent)}

.hint{font-size:12px; color:var(--mute); text-align:center; line-height:1.7}

@media (max-width:380px){
  .stage{width:250px;height:250px}
  .phase{font-size:25px; letter-spacing:4px}
}

:root{ --accent:#e5533d; --accent-soft:#fdeceb; }

</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="app">

  <div class="head">
    <h1 id="t_title">番茄钟</h1>
    <p id="t_sub">专注一会儿，再休息一会儿</p>
  </div>

  <div class="card">
    <div class="stage" style="margin:0 auto"><canvas id="cv" width="288" height="288"></canvas></div>
    <div class="phase" id="phase">准备</div>
    <div class="cd" id="cd">25:00</div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="row">
    <button class="btn" id="mainBtn" onclick="toggle()">开始</button>
    <button class="btn ghost" id="resetBtn" onclick="hardReset()">重置</button>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k" id="t_done">已完成</div><div class="v" id="vDone">0</div></div>
      <div class="stat"><div class="k" id="t_round">第几轮</div><div class="v" id="vRound">1</div></div>
    </div>
  </div>

  <div class="hint" id="t_hint">每完成 4 个番茄，进入一次长休息</div>

</div>
<script>

/* ============================================================
 * 番茄钟
 * ------------------------------------------------------------
 * 状态机：专注(25min) → 短休息(5min) → …… → 每 4 个番茄后长休息(15min)
 * 关键点：
 *   - 用「目标时间戳 deadline」而不是「剩余秒数自减」来计时。
 *     因为 setInterval 会被浏览器节流（尤其后台标签页），
 *     自减会越走越慢；用时间戳即使掉帧也能自动校正。
 *   - 暂停时把剩余时间存进 remainMs，恢复时用 now + remainMs 重算 deadline。
 * ========================================================== */

const DUR = { focus:25*60*1000, short:5*60*1000, long:15*60*1000 };
const LONG_EVERY = 4;      /* 每几个番茄进入一次长休息 */

const I18N = {
  zh:{ title:'番茄钟', sub:'专注一会儿，再休息一会儿', hint:'每完成 4 个番茄，进入一次长休息',
       start:'开始', pause:'暂停', resume:'继续', reset:'重置',
       done:'已完成', round:'第几轮',
       focus:'专注', short:'短休息', long:'长休息' },
  en:{ title:'Pomodoro', sub:'Focus a while, then rest a while', hint:'Long break after every 4 pomodoros',
       start:'Start', pause:'Pause', resume:'Resume', reset:'Reset',
       done:'Done', round:'Round',
       focus:'Focus', short:'Short break', long:'Long break' }
};

let lang='zh';
let mode='focus';        /* 当前阶段：focus / short / long */
let remainMs=DUR.focus;  /* 剩余毫秒（暂停时保存） */
let deadline=0;          /* 目标时间戳（运行时有效） */
let running=false, ticker=null;
let finished=0;          /* 已完成番茄数 */

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var CX=144, CY=144, R=112;

/* ---------- 界面 ---------- */
function refresh(){
  var L=I18N[lang];
  document.getElementById('t_title').textContent=L.title;
  document.getElementById('t_sub').textContent=L.sub;
  document.getElementById('t_hint').textContent=L.hint;
  document.getElementById('t_done').textContent=L.done;
  document.getElementById('t_round').textContent=L.round;
  document.getElementById('mainBtn').textContent = running ? L.pause : (remainMs<DUR[mode] ? L.resume : L.start);
  document.getElementById('resetBtn').textContent=L.reset;
  document.getElementById('phase').textContent=L[mode];
  document.getElementById('vDone').textContent=finished;
  document.getElementById('vRound').textContent=(finished%LONG_EVERY)+1;
}

/* ---------- 控制 ---------- */
function toggle(){ running ? pause() : start(); }

function start(){
  running=true;
  deadline=Date.now()+remainMs;
  refresh();
  ticker=setInterval(tick,100);
}

function pause(){
  running=false;
  clearInterval(ticker);
  remainMs=Math.max(0,deadline-Date.now());   /* 冻结剩余时间，供 resume 使用 */
  refresh();
}

function hardReset(){
  running=false; clearInterval(ticker);
  mode='focus'; remainMs=DUR.focus; finished=0;
  refresh(); draw(1);
}

/** 计时推进：用 deadline 反算剩余，天然抗掉帧 */
function tick(){
  remainMs=Math.max(0,deadline-Date.now());
  var total=DUR[mode];
  draw(remainMs/total);                 /* 1 → 0，圆环逐渐清空 */
  document.getElementById('cd').textContent=fmt(remainMs);
  if (remainMs<=0) nextPhase();
}

/** 阶段切换：专注结束计数，按规则决定下一次休息类型 */
function nextPhase(){
  if (mode==='focus'){
    finished++;
    var isLong = (finished % LONG_EVERY === 0);
    mode = isLong ? 'long' : 'short';
  } else {
    mode='focus';
  }
  remainMs=DUR[mode];
  deadline=Date.now()+remainMs;
  refresh();
}

/** 毫秒 → mm:ss */
function fmt(ms){
  var s=Math.ceil(ms/1000);
  var m=Math.floor(s/60);
  var r=s%60;
  return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
}

/** 画环形进度：底轨 + 进度弧（从 12 点方向顺时针） */
function draw(p){
  ctx.clearRect(0,0,288,288);

  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='#eef1f3'; ctx.lineWidth=10; ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX,CY,R,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,Math.min(1,p)));
  ctx.strokeStyle='#e5533d'; ctx.lineWidth=10; ctx.lineCap='round'; ctx.stroke();

  var g=ctx.createRadialGradient(CX,CY,10,CX,CY,R-16);
  g.addColorStop(0,'rgba(229,83,61,.16)');
  g.addColorStop(1,'rgba(229,83,61,.04)');
  ctx.beginPath(); ctx.arc(CX,CY,R-16,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
}

function toggleLang(){
  lang=(lang==='zh')?'en':'zh';
  refresh();
}

refresh();
draw(1);

/* ---------- PWA 注册 ----------
 * 注册 Service Worker 后本页被缓存，断网也能打开。
 * 放在最后且 catch 掉异常：即使浏览器不支持也不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
